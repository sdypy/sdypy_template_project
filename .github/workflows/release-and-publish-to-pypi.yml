name: Create a Release on Tag

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment name set in the trusted publisher on PyPI.
    # Add protection rules (e.g. required reviewers) under Settings -> Environments.
    environment:
      name: pypi
      url: https://pypi.org/p/sdypy-template-project

    permissions:
      contents: write    # commit the version sync and create the GitHub Release
      id-token: write    # PyPI Trusted Publishing (OIDC), no API token needed

    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: pip install build tomli tomli-w

    - name: Extract tag version
      id: tag
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Set version from tag
      run: python sync_version.py --set-version ${{ steps.tag.outputs.version }}

    - name: Check if there are changes
      id: diff
      run: |
        if git diff --quiet; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit version sync (if needed)
      if: steps.diff.outputs.changed == 'true'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git commit -am "sync version to ${{ steps.tag.outputs.version }}"
        git push origin HEAD:master

    - name: Build distribution
      run: python -m build

    - name: Create GitHub Release and upload artifacts
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*

    # Publishing uses PyPI Trusted Publishing: configure this repository and
    # workflow file as a trusted publisher on PyPI (Your projects -> Publishing).
    # No PYPI_API_TOKEN secret is required.
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@v1.14.2

    # Alternative, if you cannot use Trusted Publishing: store a PyPI API token
    # as the PYPI_API_TOKEN repository secret, drop the `id-token: write`
    # permission above, and use this step instead of the one above.
    #
    # - name: Publish to PyPI
    #   uses: pypa/gh-action-pypi-publish@v1.14.2
    #   with:
    #     password: ${{ secrets.PYPI_API_TOKEN }}
